<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Volunteer sign-up</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/config.js"></script>
  <script src="assets/common.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="wrap">
    <p style="margin:16px 0 0"><a href="index.html">&larr; All events</a></p>
    <div id="content"><div class="spinner"></div></div>
  </main>

  <div class="actionbar" id="actionbar">
    <div class="inner">
      <span id="selcount"></span>
      <button class="btn" id="continue">Sign up</button>
    </div>
  </div>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <button class="close" id="close" aria-label="Close">&times;</button>
    <div id="form-view">
      <h2 id="sheet-title">Your details</h2>
      <div class="picked" id="picked"></div>
      <form id="form" novalidate>
        <div class="row">
          <div><label for="first_name">First name</label><input id="first_name" name="first_name" type="text" autocomplete="given-name" required></div>
          <div><label for="last_name">Last name</label><input id="last_name" name="last_name" type="text" autocomplete="family-name" required></div>
        </div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
        <label for="mobile">Mobile</label>
        <input id="mobile" name="mobile" type="tel" autocomplete="tel" inputmode="tel" placeholder="0412 345 678" required>
        <label for="comments">Comments <span class="opt">(optional)</span></label>
        <textarea id="comments" name="comments" placeholder="Anything the organiser should know?"></textarea>
        <div class="hp" aria-hidden="true"><label>Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
        <label class="check"><input type="checkbox" id="remember" checked> Remember my details on this device</label>
        <div id="form-error"></div>
        <button class="btn block" type="submit" id="submit" style="margin-top:16px">Confirm sign-up</button>
        <p class="small muted center">Your contact details are only shared with the event organisers. Other volunteers just see your first name and last initial.</p>
      </form>
    </div>
    <div id="done-view" class="hidden"></div>
  </div>

  <script>
    const id = new URLSearchParams(location.search).get('id');
    const selected = new Set();
    let event = null;

    async function load() {
      const box = $('#content');
      try {
        ({ event } = await api('/api/events/' + encodeURIComponent(id || '')));
      } catch (err) {
        box.innerHTML = `<div class="error">${esc(err.message)}</div>`;
        return;
      }
      document.title = `${event.title} | ${PNC_CONFIG.orgName}`;
      const byDate = {};
      for (const s of event.slots) (byDate[s.date] ||= []).push(s);
      const anyOpen = event.slots.some(s => !s.closed && s.filled < s.capacity);
      box.innerHTML = `
        <h1>${esc(event.title)}</h1>
        ${event.location ? `<p class="muted" style="margin:0">📍 ${esc(event.location)}</p>` : ''}
        ${event.description ? `<p>${nl2br(event.description)}</p>` : ''}
        <p class="small muted">${anyOpen ? 'Tap one or more slots, then press <strong>Sign up</strong>.' : 'Every slot is filled. Thank you to all our volunteers!'}</p>
        ${Object.entries(byDate).map(([date, slots]) => `
          <div class="day-heading">${esc(fmtDate(date))}</div>
          <div class="stack">${slots.map(slotHtml).join('')}</div>`).join('')}
        ${event.contact_name || event.contact_email ? `<p class="small muted" style="margin-top:28px">Questions? Contact ${event.contact_email
          ? `<a href="mailto:${esc(event.contact_email)}">${esc(event.contact_name || event.contact_email)}</a>` : esc(event.contact_name)}.</p>` : ''}`;
      $$('.slot:not(.disabled)').forEach(el => el.addEventListener('click', () => toggle(+el.dataset.id, el)));
      $$('.slot:not(.disabled)').forEach(el => el.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(+el.dataset.id, el); } }));
      // keep previously ticked slots ticked after a reload
      for (const sid of [...selected]) {
        const el = $(`.slot[data-id="${sid}"]`);
        if (el && !el.classList.contains('disabled')) el.classList.add('selected'); else selected.delete(sid);
      }
      updateBar();
    }

    function slotHtml(s) {
      const full = s.filled >= s.capacity;
      const left = s.capacity - s.filled;
      const disabled = full || s.closed;
      const status = s.closed ? 'Closed' : full ? 'Full, thank you!' : `${left} of ${s.capacity} spot${s.capacity === 1 ? '' : 's'} left`;
      return `
        <div class="card slot${disabled ? ' disabled' : ''}" data-id="${s.id}" ${disabled ? '' : 'tabindex="0" role="checkbox" aria-checked="false"'}>
          <span class="tick" aria-hidden="true">${disabled ? '' : ''}</span>
          <div class="body">
            <div class="time">${fmtTime(s.start_time)} to ${fmtTime(s.end_time)}</div>
            <div class="title">${esc(s.title)}</div>
            ${s.details ? `<div class="details">${nl2br(s.details)}</div>` : ''}
            <div class="fill">${status}</div>
            <div class="bar"><i style="width:${Math.min(100, (s.filled / s.capacity) * 100)}%"></i></div>
            ${s.names.length ? `<div class="names">${s.names.map(n => `<span>${esc(n)}</span>`).join('')}</div>` : ''}
          </div>
        </div>`;
    }

    function toggle(sid, el) {
      if (selected.has(sid)) selected.delete(sid); else selected.add(sid);
      el.classList.toggle('selected', selected.has(sid));
      el.setAttribute('aria-checked', selected.has(sid));
      updateBar();
    }
    function updateBar() {
      $('#actionbar').classList.toggle('show', selected.size > 0);
      $('#selcount').textContent = `${selected.size} slot${selected.size === 1 ? '' : 's'} selected`;
    }

    function openSheet() {
      const picked = event.slots.filter(s => selected.has(s.id));
      $('#picked').innerHTML = picked.map(s => `<div><strong>${esc(s.title)}</strong><br>${esc(fmtDateShort(s.date))}, ${fmtTime(s.start_time)} to ${fmtTime(s.end_time)}</div>`).join('');
      const saved = store.get('pnc_volunteer');
      if (saved) for (const k of ['first_name', 'last_name', 'email', 'mobile']) if (!$('#' + k).value) $('#' + k).value = saved[k] || '';
      $('#form-view').classList.remove('hidden');
      $('#done-view').classList.add('hidden');
      $('#form-error').innerHTML = '';
      $('#backdrop').classList.add('show');
      $('#sheet').classList.add('show');
      setTimeout(() => { const first = $$('#form input[required]').find(i => !i.value); (first || $('#submit')).focus(); }, 250);
    }
    function closeSheet() {
      $('#backdrop').classList.remove('show');
      $('#sheet').classList.remove('show');
    }
    $('#continue').addEventListener('click', openSheet);
    $('#close').addEventListener('click', closeSheet);
    $('#backdrop').addEventListener('click', closeSheet);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

    $('#form').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target;
      const data = Object.fromEntries(new FormData(f));
      const missing = ['first_name', 'last_name', 'email', 'mobile'].filter(k => !String(data[k] || '').trim());
      if (missing.length) {
        $('#form-error').innerHTML = `<div class="error">Please fill in your ${missing.map(k => k.replace('_', ' ')).join(', ')}.</div>`;
        $('#' + missing[0]).focus();
        return;
      }
      data.slot_ids = [...selected];
      const btn = $('#submit');
      btn.disabled = true; btn.textContent = 'Signing you up…';
      try {
        const res = await api('/api/signups', { method: 'POST', body: data });
        if ($('#remember').checked) store.set('pnc_volunteer', { first_name: data.first_name, last_name: data.last_name, email: data.email, mobile: data.mobile });
        else store.del('pnc_volunteer');
        if (!res.ok) {
          $('#form-error').innerHTML = `<div class="error">${res.problems.map(p => esc(p.reason)).join('<br>')}</div>`;
          selected.clear();
          await load();
          return;
        }
        const ok = event.slots.filter(s => res.created.some(c => c.slot_id === s.id));
        $('#form-view').classList.add('hidden');
        $('#done-view').classList.remove('hidden');
        $('#done-view').innerHTML = `
          <div class="center" style="font-size:44px;margin-top:6px">🎉</div>
          <h2 class="center">Thank you, ${esc(data.first_name)}!</h2>
          <p class="center">You're signed up for:</p>
          <div class="picked">${ok.map(s => `<div><strong>${esc(s.title)}</strong><br>${esc(fmtDateShort(s.date))}, ${fmtTime(s.start_time)} to ${fmtTime(s.end_time)}</div>`).join('')}</div>
          ${res.problems.length ? `<div class="notice">${res.problems.map(p => esc(p.reason)).join('<br>')}</div>` : ''}
          <p>We've emailed a confirmation to <strong>${esc(data.email)}</strong>. It has a link to change or cancel, and we'll remind you the day before.</p>
          <a class="btn block secondary" href="${esc(new URL(res.manage_url).pathname.split('/').pop() + new URL(res.manage_url).search)}">View my sign-up</a>
          <button class="btn block" style="margin-top:10px" onclick="closeSheet()">Done</button>`;
        $('#comments').value = '';
        selected.clear();
        load();
      } catch (err) {
        $('#form-error').innerHTML = `<div class="error">${esc(err.message)}</div>`;
      } finally {
        btn.disabled = false; btn.textContent = 'Confirm sign-up';
      }
    });

    load();
  </script>
</body>
</html>
