name = "pnc-volunteers-api"
main = "worker.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "pnc-volunteers"
database_id = "REPLACE_WITH_YOUR_D1_ID"  # only needed if you deploy with the wrangler CLI

[triggers]
crons = ["5 * * * *"]

[vars]
SITE_URL = "https://patrycka.github.io/pnc-volunteers"
ALLOWED_ORIGIN = "https://patrycka.github.io"
ORG_NAME = "Example Public School P&C"
TIMEZONE = "Australia/Sydney"
EMAIL_MODE = "log"
DAILY_EMAIL_LIMIT = "90"
REMINDER_HOURS = "24"
